<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Bio</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d13;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #enter-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        #enter-screen p {
            font-size: 18px;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
        }
        .bio-container {
            background: rgba(20, 20, 30, 0.6);
            padding: 40px 30px;
            border-radius: 20px;
            width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.8s ease;
        }
        .avatar {
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 2px solid #7149e8;
            box-shadow: 0 0 20px #7149e8;
            margin-bottom: 15px;
        }
        h1 { font-size: 22px; margin-bottom: 5px; color: #fff; text-shadow: 0 0 10px #7149e8; }
        .tagline { font-size: 14px; color: #8a8a9e; margin-bottom: 25px; }
        .social-btn {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s ease;
        }
        .social-btn i { font-size: 20px; width: 30px; text-align: left; }
        .social-btn:hover {
            transform: translateY(-3px);
            background: rgba(113, 73, 232, 0.2);
            border-color: #7149e8;
            box-shadow: 0 0 15px rgba(113, 73, 232, 0.4);
        }
        .blog-link {
            display: inline-block;
            margin-top: 15px;
            font-size: 13px;
            color: #7149e8;
            text-decoration: none;
        }
        .blog-link:hover { text-decoration: underline; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="enter-screen" onclick="startBio()">
        <p>[ CLICK TO ENTER ]</p>
    </div>

    <div class="bio-container" id="main-bio">
        <img src="https://dicebear.com" alt="Avatar" class="avatar">
        <h1>MinhFuryzy 👑</h1>
        <p class="tagline">Welcome to my digital space</p>

        <a href="https://youtube.com" target="_blank" class="social-btn">
            <i class="fab fa-youtube" style="color: #ff0000;"></i> YouTube Channel
        </a>
        <a href="https://facebook.com" target="_blank" class="social-btn">
            <i class="fab fa-facebook" style="color: #1877f2;"></i> Facebook Profile
        </a>
        <a href="https://tiktok.com" target="_blank" class="social-btn">
            <i class="fab fa-tiktok" style="color: #fff;"></i> TikTok Videos
        </a>
        <a href="https://discord.com" target="_blank" class="social-btn">
            <i class="fab fa-discord" style="color: #5865F2;"></i> Discord Server
        </a>

        <a href="blog.html" class="blog-link">Xem các bài viết thủ thuật của tôi &rarr;</a>
    </div>

    <audio id="bg-music" src="https://soundhelix.com" loop></audio>

    <script>
        function startBio() {
            document.getElementById('enter-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('enter-screen').style.display = 'none'; }, 800);
            const bio = document.getElementById('main-bio');
            bio.style.opacity = '1';
            bio.style.transform = 'scale(1)';
            document.getElementById('bg-music').play().catch(e => console.log("Chặn tự phát nhạc"));
        }
    </script>
</body>
</html>
