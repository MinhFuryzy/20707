<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinhFuryzy | Video Bio</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0d0d13;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* KHUNG VIDEO NỀN TRÀN VIỀN */
        .video-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            opacity: 0.6; /* Độ mờ video giúp nhìn rõ chữ Bio */
        }

        /* Lớp phủ tối cho video */
        .video-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 13, 19, 0.4);
            z-index: 2;
        }

        #enter-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        #enter-screen p {
            font-size: 20px;
            letter-spacing: 4px;
            color: #7149e8;
            text-shadow: 0 0 10px rgba(113, 73, 232, 0.6);
            animation: blink 1.5s infinite;
        }

        .bio-container {
            background: rgba(10, 10, 15, 0.5);
            padding: 45px 35px;
            border-radius: 24px;
            width: 390px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transform: scale(0.8) translateY(30px);
            opacity: 0;
            transition: all 1s ease;
            z-index: 10;
        }

        .avatar-box {
            position: relative;
            width: 110px; height: 110px;
            margin: 0 auto 20px auto;
        }

        .avatar {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 2;
        }

        .avatar-box::after {
            content: "";
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, #7149e8, #00d2ff, #7149e8);
            z-index: 1;
            animation: rotateGlow 4s linear infinite;
            filter: blur(4px);
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(to right, #fff 20%, #7149e8 50%, #00d2ff 80%, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 5s linear infinite;
        }

        @keyframes shineText { to { background-position: 200% center; } }

        .tagline { font-size: 13px; color: #d1d1e0; margin-bottom: 30px; }

        .social-btn {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-decoration: none;
            padding: 14px 22px;
            margin-bottom: 14px;
            border-radius: 16px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .social-btn i { font-size: 22px; width: 35px; text-align: left; }
        .social-btn:hover { transform: translateY(-4px); }
        .social-btn.youtube:hover { background: rgba(255, 0, 0, 0.2); border-color: #ff0000; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
        .social-btn.facebook:hover { background: rgba(24, 119, 242, 0.2); border-color: #1877f2; box-shadow: 0 0 20px rgba(24, 119, 242, 0.4); }
        .social-btn.tiktok:hover { background: rgba(255, 255, 255, 0.15); border-color: #fff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
        .social-btn.discord:hover { background: rgba(88, 101, 242, 0.2); border-color: #5865F2; box-shadow: 0 0 20px rgba(88, 101, 242, 0.4); }

        .blog-link { display: inline-block; margin-top: 20px; font-size: 13px; color: #d1d1e0; text-decoration: none; }
        .blog-link:hover { color: #00d2ff; }
        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- Màn hình chào [ CLICK TO ENTER ] -->
    <div id="enter-screen" onclick="startBio()">
        <p>[ CLICK TO ENTER ]</p>
    </div>

    <!-- VIDEO NỀN ATTACK ON TITAN CHÍNH CHỦ CỦA BẠN -->
    <video id="bg-video" class="video-background" loop muted playsinline>
        <source src="https://streamable.com" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <!-- Khung thông tin cá nhân -->
    <div class="bio-container" id="main-bio">
        <div class="avatar-box">
            <img src="https://dicebear.com" alt="Avatar" class="avatar">
        </div>
        <h1>MinhFuryzy 👑</h1>
        <p class="tagline">Welcome to my digital space</p>

        <a href="https://youtube.com" target="_blank" class="social-btn youtube">
            <i class="fab fa-youtube" style="color: #ff0000;"></i> YouTube Channel
        </a>
        <a href="https://facebook.com" target="_blank" class="social-btn facebook">
            <i class="fab fa-facebook" style="color: #1877f2;"></i> Facebook Profile
        </a>
        <a href="https://tiktok.com" target="_blank" class="social-btn tiktok">
            <i class="fab fa-tiktok" style="color: #fff;"></i> TikTok Videos
        </a>
        <a href="https://discord.gg" target="_blank" class="social-btn discord">
            <i class="fab fa-discord" style="color: #5865F2;"></i> Discord Server
        </a>

        <a href="blog.html" class="blog-link">Xem các bài viết thủ thuật của tôi &rarr;</a>
    </div>

    <!-- Nhạc nền -->
    <audio id="bg-music" src="https://soundhelix.com" loop></audio>

    <script>
        function startBio() {
            const enterScreen = document.getElementById('enter-screen');
            enterScreen.style.opacity = '0';
            setTimeout(() => { enterScreen.style.display = 'none'; }, 1000);
            
            const bio = document.getElementById('main-bio');
            bio.style.opacity = '1';
            bio.style.transform = 'scale(1) translateY(0)';
            
            // Kích hoạt phát cả video và nhạc cùng lúc
            document.getElementById('bg-video').play();
            document.getElementById('bg-music').play().catch(e => console.log("Chặn phát nhạc"));
        }
    </script>
</body>
</html>
